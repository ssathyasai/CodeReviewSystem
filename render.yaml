# =============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Unified Single Full-Stack Web Service (Frontend + Backend Deployed at Once)
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Unified Full-Stack Web Service
  # Serves both the React SPA Dashboard and FastAPI REST Backend on a single URL
  # ---------------------------------------------------------------------------
  - type: web
    name: codereview-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: groq
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: codereview_db
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
