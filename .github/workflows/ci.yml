name: CI Automated Security & Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pymongo python-dotenv psutil requests pyyaml httpx

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Run Pytest Backend Suite
        env:
          MONGODB_URI: mongodb://localhost:27017/codereview_test_db
        run: |
          pytest tests/
